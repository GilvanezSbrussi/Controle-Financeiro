<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Administrativo - Controle sua Fortuna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .icon { text-align: center; font-size: 4rem; margin-bottom: 1rem; }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: #111827;
      margin-bottom: .5rem;
    }
    p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: .9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: .4rem;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #0f766e; }
    button {
      width: 100%;
      padding: 14px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #115e59; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error {
      background: #fee;
      color: #c00;
      padding: 10px;
      border-radius: 8px;
      font-size: .88rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
    .loading { text-align: center; color: #6b7280; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="icon">🔐</div>
    <h1>Acesso Administrativo</h1>
    <p class="subtitle">Digite seu CPF para acessar o gerador de licenças</p>
    
    <div class="error" id="errorBox"></div>
    
    <form id="loginForm">
      <label for="cpf">CPF ou CNPJ</label>
      <input 
        type="text" 
        id="cpf" 
        placeholder="000.000.000-00"
        required
        autocomplete="off"
      />
      
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    
    <p style="text-align:center; margin-top:1.5rem; font-size:.78rem; color:#9ca3af;">
      ⚠️ Acesso restrito a administradores autorizados
    </p>
  </div>

  <script>
  const form = document.getElementById('loginForm');
  const cpfInput = document.getElementById('cpf');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  const CLIENTS_LOCAL_KEY = "financas-clients-v1";

  cpfInput.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length <= 11) {
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }
    e.target.value = v;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const cpf = cpfInput.value.replace(/\D/g, '');

    if (cpf.length !== 11 && cpf.length !== 14) {
      showError('CPF/CNPJ inválido');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Verificando...';
    errorBox.classList.remove('show');

    // Tenta primeiro via servidor (quando acessado pelo PC/rede)
    try {
      const response = await fetch(`${window.location.origin}/admin/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ document: cpf }),
        signal: AbortSignal.timeout(3000)
      });

      if (response.ok) {
        const result = await response.json();
        if (result.valid && result.token) {
          sessionStorage.setItem('adminToken', result.token);
          sessionStorage.setItem('adminName', result.name);
          window.location.href = `${window.location.origin}/admin/gerador?token=${result.token}`;
          return;
        }
      }
    } catch (_) {
      // Servidor indisponível — usa validação local
    }

    // Validação local (APK sem servidor)
    try {
      const list = JSON.parse(localStorage.getItem(CLIENTS_LOCAL_KEY) || "[]");
      const admin = list.find(c =>
        String(c.document || "").replace(/\D/g, "") === cpf &&
        (c.profile || "").toUpperCase() === "ADMINISTRADOR"
      );

      if (admin) {
        sessionStorage.setItem('adminName', admin.name);
        window.location.href = 'license-admin/Gerador.html';
        return;
      }

      showError('CPF não encontrado ou não autorizado');
    } catch (_) {
      showError('Erro ao verificar acesso.');
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
</script>
</body>
</html>
