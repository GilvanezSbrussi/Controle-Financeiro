<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Extrato — Minha Fortuna</title>
  <style>
    :root{
      --primary:#0f766e;--income:#15803d;--expense:#b42318;--transfer:#1d4ed8;
      --bg:#f0f7f5;--bg2:#fff;--bg3:#e8f0ee;--text:#17211f;--text2:#61716d;--text3:#9ca3af;
      --border:#dce5e2;--shadow:0 2px 8px rgba(0,0,0,.06);--radius:14px;--rsm:10px;
    }
    [data-theme="dark"]{
      --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--text:#f3f4f6;--text2:#9ca3af;
      --text3:#6b7280;--border:#2d3148;--primary:#14b8a6;--income:#22c55e;
      --expense:#ef4444;--transfer:#60a5fa;--shadow:0 2px 16px rgba(0,0,0,.3);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .topbar{background:var(--primary);color:#fff;padding:1rem 1.25rem;padding-top:calc(1rem + env(safe-area-inset-top,0px) + 18px);display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50}
    .topbar a{color:#fff;text-decoration:none;font-size:1.4rem;line-height:1;flex-shrink:0}
    .topbar h1{font-size:1.1rem;font-weight:700;flex:1}
    .topbar-actions{display:flex;gap:6px;flex-wrap:wrap}
    .tbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
    .tbtn:hover{background:rgba(255,255,255,.3)}
    .tbtn:active{transform:scale(.95)}
    .tbtn-theme{background:rgba(255,255,255,.18);border:none;cursor:pointer;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s}
    .content{padding:1rem;max-width:600px;margin:0 auto;padding-bottom:60px}
    .filters{background:var(--bg2);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
    .filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
    .filter-row label{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--text2)}
    .filter-row input{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--bg3);color:var(--text);outline:none;width:100%}
    .filter-row input:focus{border-color:var(--primary)}
    .date-actions{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
    .clear-dates-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}
    .clear-dates-btn:hover{background:var(--border);color:var(--text)}
    .filter-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
    .chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;user-select:none}
    .chip:active{transform:scale(.95)}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .chip.income.active{background:var(--income);border-color:var(--income)}
    .chip.expense.active{background:var(--expense);border-color:var(--expense)}
    .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem}
    .summary-card{background:var(--bg2);border-radius:var(--rsm);padding:.85rem;text-align:center;box-shadow:var(--shadow)}
    .summary-card small{font-size:.72rem;color:var(--text2);display:block;margin-bottom:4px}
    .summary-card strong{font-size:.95rem;font-weight:700;display:block}
    .income-text{color:var(--income)}
    .expense-text{color:var(--expense)}
    .balance-text{color:var(--primary)}
    .section-label{font-size:.78rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:.65rem 0 .3rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);margin-bottom:.35rem;position:sticky;top:64px;background:var(--bg);z-index:5}
    .day-total{font-size:.72rem;font-weight:700}
    .transaction-item{background:var(--bg2);border-radius:var(--rsm);padding:.85rem 1rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
    .transaction-info{flex:1;display:flex;flex-direction:column;gap:4px}
    .transaction-category{font-size:.85rem;font-weight:600;color:var(--text)}
    .transaction-date{font-size:.72rem;color:var(--text2)}
    .transaction-amount{font-size:.9rem;font-weight:700;text-align:right}
    .amount-income{color:var(--income)}
    .amount-expense{color:var(--expense)}
    .amount-transfer{color:var(--transfer)}
    /* MODAL */
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
    .modal.show{display:flex}
    .modal-content{background:var(--bg2);border-radius:var(--radius);padding:1.5rem;max-width:90%;width:320px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:slideUp .3s ease-out}
    @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-title{font-size:1rem;font-weight:700;margin-bottom:.5rem;color:var(--text)}
    .modal-sub{font-size:.85rem;color:var(--text2);margin-bottom:1.25rem}
    .modal-actions{display:flex;flex-direction:column;gap:.5rem}
    .modal-btn{padding:12px 16px;border:none;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .2s;width:100%}
    .modal-btn-cancel{background:var(--bg3);color:var(--text)}
    .modal-btn-share{background:var(--primary);color:#fff}
    .modal-btn-open{background:#7c3aed;color:#fff}
    .modal-btn:active{transform:scale(.96)}
    /* LOADER */
    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:2000;display:none;align-items:center;justify-content:center}
    .loader.show{display:flex}
    .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-inner{text-align:center}
    .loader-text{color:#fff;margin-top:1rem;font-size:.9rem}
    .loader-sub{color:#fff;margin-top:.4rem;font-size:.78rem;opacity:.75}
    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:.9rem 1.4rem;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:3000;display:none;max-width:88%;word-break:break-word;text-align:center;font-size:.87rem;line-height:1.4}
    .toast.show{display:block;animation:toastIn .25s ease-out}
    .toast.error{background:#b42318}
    .toast.success{background:#15803d}
    .toast.info{background:#1d4ed8}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    /* VIEWER */
    #pdfViewer{display:none;position:fixed;inset:0;background:#404040;z-index:4000;flex-direction:column}
    #pdfViewer.show{display:flex}
    #pdfViewerBar{background:#222;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    #pdfViewerBar span{color:#fff;font-size:.88rem;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #pdfViewerShare{background:var(--primary);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;flex-shrink:0}
    #pdfViewerClose{background:#ef4444;border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    #pdfViewerFrame{flex:1;width:100%;border:none;background:#525659}
    /* FALLBACK VIEWER quando iframe não renderiza PDF */
    #pdfFallback{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center}
    #pdfFallback.show{display:flex}
    #pdfFallback p{color:#ddd;font-size:.9rem;line-height:1.5}
    #pdfFallback .fb-btn{background:var(--primary);border:none;color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;max-width:280px}
    @media(max-width:480px){
      .topbar{padding:.8rem 1rem;padding-top:calc(.8rem + env(safe-area-inset-top,0px) + 18px)}
      .topbar h1{font-size:1rem}
      .tbtn{padding:7px 10px;font-size:.75rem}
      .summary{grid-template-columns:1fr}
      .content{padding:.75rem}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">←</a>
    <h1>Extrato</h1>
    <div class="topbar-actions">
      <button class="tbtn" id="exportPdfBtn">📄 PDF</button>
      <button class="tbtn-theme" id="themeBtn">🌙</button>
    </div>
  </div>

  <div class="content">
    <div class="filters">
      <div class="filter-chips">
        <div class="chip active" data-filter="all">Todos</div>
        <div class="chip income" data-filter="income">Entrada</div>
        <div class="chip expense" data-filter="expense">Saída</div>
        <div class="chip transfer" data-filter="transfer">Transferência</div>
      </div>
      <div class="filter-row">
        <label>Data inicial<input type="date" id="dateFrom"></label>
        <label>Data final<input type="date" id="dateTo"></label>
      </div>
      <div class="date-actions">
        <button class="clear-dates-btn" id="clearDatesBtn">🗓️ Mês atual</button>
        <button class="clear-dates-btn" id="clearAllDatesBtn">📅 Todas as datas</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card"><small>Entradas</small><strong class="income-text" id="totalIncome">R$ 0,00</strong></div>
      <div class="summary-card"><small>Saídas</small><strong class="expense-text" id="totalExpense">R$ 0,00</strong></div>
      <div class="summary-card"><small>Saldo</small><strong class="balance-text" id="totalBalance">R$ 0,00</strong></div>
    </div>

    <div id="transactionsList"></div>
  </div>

  <!-- MODAL EXPORTAR -->
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h3 class="modal-title">📄 Exportar Extrato</h3>
      <p class="modal-sub">Escolha como deseja exportar:</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-share" id="btnShare">📤 Compartilhar PDF</button>
        <button class="modal-btn modal-btn-open"  id="btnView">👁️ Visualizar PDF</button>
        <button class="modal-btn modal-btn-cancel" id="btnCancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- VISUALIZADOR INLINE -->
  <div id="pdfViewer">
    <div id="pdfViewerBar">
      <span id="pdfViewerName">📄 Extrato.pdf</span>
      <button id="pdfViewerShare">📤 Compartilhar</button>
      <button id="pdfViewerClose">✕</button>
    </div>
    <iframe id="pdfViewerFrame" src="about:blank"></iframe>
    <div id="pdfFallback">
      <p>O PDF foi gerado mas seu dispositivo não consegue exibi-lo aqui.<br>Use o botão abaixo para compartilhar ou salvar.</p>
      <button class="fb-btn" id="pdfFallbackShare">📤 Compartilhar / Salvar PDF</button>
    </div>
  </div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="spinner"></div>
      <div class="loader-text">Gerando PDF…</div>
      <div class="loader-sub" id="loaderSub">Aguarde</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- jsPDF 2.5.1 — sem html2canvas, funciona no Capacitor com androidScheme https -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
  'use strict';

  // Escapa texto do usuário antes de inserir em innerHTML (previne XSS
  // armazenado vindo de descrição/categoria digitada ou importada via backup)
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str === null || str === undefined ? '' : String(str);
    return div.innerHTML;
  }

  /* ─────────────────────────────────────────────
     AMBIENTE
  ───────────────────────────────────────────── */
  const ENV = {
    isCapacitor : !!(window.Capacitor?.isNativePlatform?.()),
    isCordova   : typeof window.cordova !== 'undefined',
    get cap()   { return window.Capacitor?.Plugins; },
    get share()  { return this.cap?.Share; },
    get fs()     { return this.cap?.Filesystem; },
  };

  /* ─────────────────────────────────────────────
     DADOS
  ───────────────────────────────────────────── */
  function getDB()        { try { return JSON.parse(localStorage.getItem('financas-v3') || '{}'); } catch { return {}; } }
  function getTxns()      { const d = getDB(); return Array.isArray(d.transactions) ? d.transactions : []; }
  function getAccounts()  { const d = getDB(); return Array.isArray(d.accounts) ? d.accounts : [{id:'corrente',name:'Conta corrente'},{id:'investimentos',name:'Investimentos'}]; }
  function accName(id)    { return getAccounts().find(a => a.id === id)?.name ?? id; }

  let txns = getTxns();
  let filter = 'all';
  let lastB64 = null, lastFile = '';

  /* ─────────────────────────────────────────────
     TEMA
  ───────────────────────────────────────────── */
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  (function initTheme() {
    const t = localStorage.getItem('financas-theme') || 'light';
    html.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'light' ? '🌙' : '☀️';
  })();
  themeBtn.addEventListener('click', () => {
    const n = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', n);
    localStorage.setItem('financas-theme', n);
    themeBtn.textContent = n === 'light' ? '🌙' : '☀️';
  });

  /* ─────────────────────────────────────────────
     FORMATAÇÃO
  ───────────────────────────────────────────── */
  const BRL  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Math.abs(v));
  const fmtD = s => new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(s+'T00:00:00'));
  const fmtW = s => new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'2-digit'}).format(new Date(s+'T00:00:00')).replace(/,/,'');
  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  /* ─────────────────────────────────────────────
     DATAS
  ───────────────────────────────────────────── */
  function setCurrentMonth() {
    const n = new Date();
    document.getElementById('dateFrom').value = new Date(n.getFullYear(), n.getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('dateTo').value   = new Date(n.getFullYear(), n.getMonth()+1, 0).toISOString().split('T')[0];
  }

  /* ─────────────────────────────────────────────
     FILTROS
  ───────────────────────────────────────────── */
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', function() {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    filter = this.dataset.filter;
    render();
  }));
  document.getElementById('dateFrom').addEventListener('change', render);
  document.getElementById('dateTo').addEventListener('change', render);
  document.getElementById('clearDatesBtn').addEventListener('click', () => {
    setCurrentMonth(); render();
    const n = new Date(); toast(`Filtro: ${MONTHS[n.getMonth()]}/${n.getFullYear()}`, 'success');
  });
  document.getElementById('clearAllDatesBtn').addEventListener('click', () => {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value   = '';
    render(); toast('Exibindo todas as transações', 'success');
  });

  function getFiltered() {
    let f = [...txns];
    if (filter !== 'all') f = f.filter(t => t.type === filter);
    const from = document.getElementById('dateFrom').value;
    const to   = document.getElementById('dateTo').value;
    if (from) f = f.filter(t => t.date >= from);
    if (to)   f = f.filter(t => t.date <= to);
    return f.sort((a,b) => new Date(b.date) - new Date(a.date));
  }

  /* ─────────────────────────────────────────────
     RENDER
  ───────────────────────────────────────────── */
  function render() {
    const filtered = getFiltered();
    const wrap = document.getElementById('transactionsList');
    wrap.innerHTML = '';

    if (!filtered.length) {
      const from = document.getElementById('dateFrom').value;
      const to   = document.getElementById('dateTo').value;
      let msg = 'Nenhuma transação encontrada';
      if (from && to) msg += ` de ${fmtD(from)} a ${fmtD(to)}`;
      wrap.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text2)">${msg}</div>`;
      updateSummary([]);
      return;
    }

    const grouped = {};
    filtered.forEach(t => { (grouped[t.date] ??= []).push(t); });

    Object.keys(grouped).sort((a,b) => new Date(b)-new Date(a)).forEach(date => {
      const items = grouped[date];
      const dayTotal = items.reduce((s,t) => {
        const a = parseFloat(t.amount)||0;
        return t.type==='income' ? s+a : t.type==='expense' ? s-a : s+a;
      }, 0);

      const sec = document.createElement('div');
      sec.innerHTML = `<div class="section-label"><span>${fmtW(date)}</span><span class="day-total">${BRL(dayTotal)}</span></div>`;

      items.forEach(t => {
        const el = document.createElement('div');
        el.className = 'transaction-item';
        const amt = parseFloat(t.amount)||0;
        let sign='', cls='';
        if (t.type==='income'){ sign='+'; cls='amount-income'; }
        else if (t.type==='expense'){ sign='-'; cls='amount-expense'; }
        else { cls='amount-transfer'; sign=amt>=0?'+':'-'; }
        let desc = t.description||'Sem descrição';
        if (t.type==='transfer') desc+=` (${accName(t.fromAccount)} → ${accName(t.toAccount)})`;
        const cat = (t.category && t.type!=='transfer') ? ` • ${escapeHtml(t.category)}` : '';
        el.innerHTML = `
          <div class="transaction-info">
            <span class="transaction-category">${escapeHtml(desc)}${cat}</span>
            <span class="transaction-date">${fmtD(t.date)}</span>
          </div>
          <span class="transaction-amount ${cls}">${sign}${BRL(Math.abs(amt))}</span>`;
        sec.appendChild(el);
      });
      wrap.appendChild(sec);
    });
    updateSummary(filtered);
  }

  function updateSummary(f) {
    const inc = f.filter(t=>t.type==='income').reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
    const exp = f.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(parseFloat(t.amount)||0),0);
    document.getElementById('totalIncome').textContent  = BRL(inc);
    document.getElementById('totalExpense').textContent = BRL(exp);
    document.getElementById('totalBalance').textContent = BRL(inc-exp);
  }

  function refreshData() { txns = getTxns(); render(); }
  window.addEventListener('storage', e => { if(e.key==='financas-v3') refreshData(); });
  window.addEventListener('focus', refreshData);

  /* ─────────────────────────────────────────────
     GERAR PDF — jsPDF puro (sem html2canvas)
     Retorna string base64 pura (sem prefixo)
  ───────────────────────────────────────────── */
  function buildPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

    const filtered = getFiltered();
    const from = document.getElementById('dateFrom').value;
    const to   = document.getElementById('dateTo').value;
    let period = 'Todas as transações';
    if (from && to) period = `Período: ${fmtD(from)} a ${fmtD(to)}`;
    else if (from)  period = `A partir de: ${fmtD(from)}`;
    else if (to)    period = `Até: ${fmtD(to)}`;

    const PW=210, M=14, CW=PW-M*2;
    let y=M;

    // Cabeçalho colorido
    doc.setFillColor(15,118,110);
    doc.rect(0,0,PW,30,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(17); doc.setFont('helvetica','bold');
    doc.text('Extrato de Transações', PW/2, 12, {align:'center'});
    doc.setFontSize(8); doc.setFont('helvetica','normal');
    doc.text('Minha Fortuna', PW/2, 18, {align:'center'});
    doc.text(period, PW/2, 24, {align:'center'});
    y=36;

    // Gerado em
    doc.setTextColor(150); doc.setFontSize(7);
    doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, PW-M, y, {align:'right'});
    y+=7;

    // Resumo
    const inc = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
    const exp = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(parseFloat(t.amount)||0),0);
    const bal = inc-exp;
    const bw  = (CW-8)/3;
    [{l:'Entradas',v:BRL(inc),c:[21,128,61]},{l:'Saídas',v:BRL(exp),c:[180,35,24]},{l:'Saldo',v:BRL(bal),c:[15,118,110]}]
      .forEach(({l,v,c},i)=>{
        const x=M+i*(bw+4);
        doc.setDrawColor(210); doc.setLineWidth(0.3);
        doc.roundedRect(x,y,bw,15,2,2,'S');
        doc.setFontSize(7); doc.setTextColor(100); doc.setFont('helvetica','normal');
        doc.text(l,x+bw/2,y+5.5,{align:'center'});
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...c);
        doc.text(v,x+bw/2,y+12,{align:'center'});
      });
    y+=21;

    // Cabeçalho da tabela
    doc.setFillColor(240,247,245);
    doc.rect(M,y,CW,8,'F');
    doc.setDrawColor(15,118,110); doc.setLineWidth(0.5);
    doc.line(M,y,M+CW,y); doc.line(M,y+8,M+CW,y+8);
    doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(15,118,110);
    doc.text('Data',       M+2,    y+5.5);
    doc.text('Descrição',  M+28,   y+5.5);
    doc.text('Categoria',  M+105,  y+5.5);
    doc.text('Valor',      M+CW-2, y+5.5, {align:'right'});
    y+=8;

    // Linhas da tabela
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    filtered.forEach((t,i)=>{
      if(y>272){ doc.addPage(); y=M; }
      if(i%2===0){ doc.setFillColor(249,249,249); doc.rect(M,y,CW,8,'F'); }

      const amt=parseFloat(t.amount)||0;
      let sign='',color;
      if(t.type==='income'){ sign='+'; color=[21,128,61]; }
      else if(t.type==='expense'){ sign='-'; color=[180,35,24]; }
      else { sign=amt>=0?'+':'-'; color=[29,78,216]; }

      const cat  = t.category||(t.type==='transfer'?'Transferência':'-');
      const desc = doc.splitTextToSize(t.description||'Sem descrição',74)[0];

      doc.setTextColor(40);
      doc.text(fmtD(t.date),   M+2,   y+5.3);
      doc.text(desc,           M+28,  y+5.3);
      doc.text(String(cat).substring(0,22), M+105, y+5.3);
      doc.setTextColor(...color); doc.setFont('helvetica','bold');
      doc.text(`${sign}${BRL(Math.abs(amt))}`, M+CW-2, y+5.3, {align:'right'});
      doc.setFont('helvetica','normal');
      doc.setDrawColor(230); doc.setLineWidth(0.15);
      doc.line(M,y+8,M+CW,y+8);
      y+=8;
    });

    // Rodapé
    y+=6;
    if(y>275){ doc.addPage(); y=M+6; }
    doc.setDrawColor(200); doc.setLineWidth(0.3); doc.line(M,y,M+CW,y); y+=4;
    doc.setFontSize(7); doc.setTextColor(150); doc.setFont('helvetica','normal');
    doc.text('© Minha Fortuna — Documento confidencial', PW/2, y, {align:'center'});

    // Número de páginas
    const np=doc.internal.getNumberOfPages();
    for(let p=1;p<=np;p++){
      doc.setPage(p); doc.setFontSize(7); doc.setTextColor(180);
      doc.text(`Página ${p} de ${np}`, PW-M, 290, {align:'right'});
    }

    // Retorna base64 pura (sem prefixo "data:...")
    return doc.output('datauristring').split(',')[1];
  }

  /* ─────────────────────────────────────────────
     COMPARTILHAR / SALVAR PDF
     Cascata: Capacitor Share → Capacitor FS+Share → Web Share → <a download>
  ───────────────────────────────────────────── */
  async function sharePDF(b64, filename) {
    // 1) Capacitor Share direto (alguns builds aceitam data URI)
    if (ENV.isCapacitor && ENV.share) {
      try {
        await ENV.share.share({ title:'Extrato', url:`data:application/pdf;base64,${b64}`, dialogTitle:'Compartilhar PDF' });
        toast('PDF compartilhado!','success'); return;
      } catch(e) { if(isCancel(e)) return; }
    }

    // 2) Capacitor Filesystem → salva arquivo → Share com URI real
    if (ENV.isCapacitor && ENV.fs) {
      try {
        const res = await ENV.fs.writeFile({ path: filename, data: b64, directory: 'CACHE', recursive: true });
        const uri = res.uri;
        if (ENV.share) {
          await ENV.share.share({ title:'Extrato', url: uri, dialogTitle:'Compartilhar PDF' });
          toast('PDF compartilhado!','success'); return;
        }
      } catch(e) { if(isCancel(e)) return; }
    }

    // 3) Web Share API com File (Chrome Android / iOS Safari)
    if (navigator.share && navigator.canShare) {
      try {
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const file = new File([bytes], filename, { type:'application/pdf' });
        if (navigator.canShare({ files:[file] })) {
          await navigator.share({ files:[file], title:'Extrato' });
          toast('PDF compartilhado!','success'); return;
        }
      } catch(e) { if(isCancel(e)) return; }
    }

    // 4) Fallback: <a download> com data URI (navegador desktop / browser Android)
    try {
      const a = document.createElement('a');
      a.href = `data:application/pdf;base64,${b64}`;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => document.body.removeChild(a), 1500);
      toast('PDF baixado! Verifique Downloads.','success');
    } catch(e) {
      toast('Não foi possível salvar o PDF.','error');
    }
  }

  function isCancel(e) {
    const msg = (e?.message || '').toLowerCase();
    return e?.name === 'AbortError' || msg.includes('cancel') || msg.includes('dismiss');
  }

  /* ─────────────────────────────────────────────
     VISUALIZADOR INLINE
     Usa data URI no iframe — não precisa de blob://
     Se iframe ficar em branco, mostra fallback com botão de compartilhar
  ───────────────────────────────────────────── */
  function openViewer(b64, filename) {
    lastB64 = b64; lastFile = filename;
    document.getElementById('pdfViewerName').textContent = `📄 ${filename}`;

    const viewer  = document.getElementById('pdfViewer');
    const frame   = document.getElementById('pdfViewerFrame');
    const fallback= document.getElementById('pdfFallback');

    // Oculta o fallback, mostra o frame
    frame.style.display   = 'block';
    fallback.classList.remove('show');

    // Timeout: se o iframe não carregou conteúdo em 2.5s, mostra fallback
    let loaded = false;
    frame.onload = () => { loaded = true; };
    setTimeout(() => {
      if (!loaded) {
        frame.style.display = 'none';
        fallback.classList.add('show');
      }
    }, 2500);

    frame.src = `data:application/pdf;base64,${b64}`;
    viewer.classList.add('show');
    document.body.style.overflow = 'hidden';
    toast('Use 📤 Compartilhar para salvar o arquivo.','info');
  }

  document.getElementById('pdfViewerClose').addEventListener('click', () => {
    document.getElementById('pdfViewer').classList.remove('show');
    document.getElementById('pdfViewerFrame').src = 'about:blank';
    document.body.style.overflow = '';
  });

  async function doShare() {
    if (!lastB64) return;
    showLoader('Preparando…');
    try { await sharePDF(lastB64, lastFile); } catch(e) { toast('Erro: '+(e.message||''),'error'); }
    finally { hideLoader(); }
  }

  document.getElementById('pdfViewerShare').addEventListener('click', doShare);
  document.getElementById('pdfFallbackShare').addEventListener('click', doShare);

  /* ─────────────────────────────────────────────
     LOADER / TOAST
  ───────────────────────────────────────────── */
  const loaderEl = document.getElementById('loader');
  function showLoader(sub) { document.getElementById('loaderSub').textContent = sub||'Aguarde'; loaderEl.classList.add('show'); }
  function hideLoader()    { loaderEl.classList.remove('show'); }

  let toastTimer;
  function toast(msg, type='info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  /* ─────────────────────────────────────────────
     BOTÕES DO MODAL
  ───────────────────────────────────────────── */
  const modal = document.getElementById('confirmModal');
  document.getElementById('exportPdfBtn').addEventListener('click', () => modal.classList.add('show'));
  document.getElementById('btnCancel').addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', e => { if(e.target===modal) modal.classList.remove('show'); });

  // Compartilhar / Salvar
  document.getElementById('btnShare').addEventListener('click', async () => {
    modal.classList.remove('show');
    showLoader('Gerando PDF…');
    try {
      const b64 = buildPDF();
      const fn  = `Extrato_${new Date().toISOString().split('T')[0]}.pdf`;
      hideLoader();
      await sharePDF(b64, fn);
    } catch(e) {
      console.error(e);
      toast('Erro ao gerar PDF: '+(e.message||''),'error');
      hideLoader();
    }
  });

  // Visualizar
  document.getElementById('btnView').addEventListener('click', async () => {
    modal.classList.remove('show');
    showLoader('Gerando PDF…');
    try {
      const b64 = buildPDF();
      const fn  = `Extrato_${new Date().toISOString().split('T')[0]}.pdf`;
      hideLoader();
      openViewer(b64, fn);
    } catch(e) {
      console.error(e);
      toast('Erro ao gerar PDF: '+(e.message||''),'error');
      hideLoader();
    }
  });

  /* ─────────────────────────────────────────────
     INIT
  ───────────────────────────────────────────── */
  function init() {
    setCurrentMonth();
    render();
    const n = new Date();
    setTimeout(() => toast(`${MONTHS[n.getMonth()]}/${n.getFullYear()} — use os filtros para alterar`,'info'), 900);
  }

  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', init)
    : init();
  </script>
</body>
