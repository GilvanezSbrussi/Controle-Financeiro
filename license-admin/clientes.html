<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e5e7eb;
    }
    .eyebrow {
      font-size: .8rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: .5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 800; color: #0f766e; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 1rem; color: #111827; }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
      padding: .5rem 1rem;
      border-radius: 8px;
      background: #e6f4f3;
    }
    .back-link:hover { background: #14b8a6; color: white; }
    .form-section {
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin-bottom: 1rem;
      font-size: .9rem;
      font-weight: 600;
      color: #374151;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #0f766e; }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #115e59; }
    .hint { font-size: .85rem; color: #6b7280; margin: 1rem 0; text-align: center; }
    .client-count { font-size: .85rem; color: #6b7280; margin-bottom: .5rem; }
    .client-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .client-item {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }
    .client-item:hover { background: #e6f4f3; border-color: #14b8a6; }
    .client-item strong { display: block; color: #111827; margin-bottom: 4px; }
    .client-item span { font-size: .85rem; color: #6b7280; }
    .empty-state { text-align: center; padding: 2rem; color: #9ca3af; }
    #status {
      margin-top: 1rem;
      padding: .75rem;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: .9rem;
      color: #374151;
      min-height: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Gerador.html" class="back-link">← Voltar ao gerador</a>
    
    <div class="header">
      <p class="eyebrow">Administrador</p>
      <h1>Cadastro de clientes</h1>
    </div>

    <div class="form-section">
      <h2>Formulário de cliente</h2>
      <form id="clientForm" autocomplete="off">
        <label>
          Nome do cliente
          <input id="clientName" type="text" placeholder="Ex: João Silva" required />
        </label>
        <label>
          CPF ou CNPJ
          <input id="clientDocument" type="text" placeholder="000.000.000-00" required />
        </label>
        <label>
          E-mail
          <input id="clientEmail" type="email" placeholder="email@exemplo.com" />
        </label>
        <label>
          Perfil
          <select id="clientProfile">
            <option value="Usuário">Usuário</option>
            <option value="Administrador">Administrador</option>
          </select>
        </label>
        <button type="submit">💾 Salvar cliente</button>
      </form>
      <p class="hint">Cadastre ou atualize clientes por CPF/CNPJ.</p>
      <div id="status"></div>
    </div>

    <div>
      <h2>Clientes cadastrados</h2>
      <div class="client-count" id="clientCount">0 clientes</div>
      <input id="clientSearch" type="search" placeholder="Pesquisar cliente..." style="margin-bottom:1rem" />
      <div class="client-list" id="clientList">
        <div class="empty-state">Carregando clientes...</div>
      </div>
    </div>
  </div>

  <script src="clientes.js"></script>
</body>
</html>
