<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f766e"/>
<title>Lembretes · Minha Fortuna</title>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="styles.css"/>
<style>
:root{
--bg:#f0f4f8;--bg2:#fff;--bg3:#e8edf2;--text:#111827;--text2:#6b7280;
--text3:#9ca3af;--border:#e5e7eb;--primary:#0f766e;--primary-light:#e6f4f3;
--income:#16a34a;--expense:#dc2626;--transfer:#2563eb;--warning:#f59e0b;
--shadow:0 2px 12px rgba(0,0,0,.07);--radius:16px;--rsm:10px;
}
[data-theme="dark"]{
--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--text:#f3f4f6;--text2:#9ca3af;
--text3:#6b7280;--border:#2d3148;--primary:#14b8a6;--primary-light:#0f2926;
--income:#22c55e;--expense:#ef4444;--transfer:#60a5fa;--warning:#f59e0b;
--shadow:0 2px 16px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--primary);color:#fff;padding:1rem 1.25rem;padding-top:calc(1rem + env(safe-area-inset-top,0px) + 18px);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1.2rem;font-weight:800}
.backbtn{background:rgba(255,255,255,.18);border:none;cursor:pointer;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.backbtn:hover{background:rgba(255,255,255,.3)}
.content{padding:1rem;padding-bottom:80px;max-width:640px;margin:0 auto}
.card{background:var(--bg2);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.card-title h2{font-size:.95rem;font-weight:700}
.card-title span{font-size:.78rem;color:var(--text2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--text2)}
.fgrid label.full{grid-column:span 2}
.fgrid input,.fgrid select{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:.9rem;background:var(--bg3);color:var(--text);outline:none;transition:border-color .2s;width:100%}
.fgrid input:focus,.fgrid select:focus{border-color:var(--primary)}
.pbtn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:var(--rsm);font-size:.95rem;font-weight:700;cursor:pointer}
.pbtn:hover{opacity:.9}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.tx-list{display:flex;flex-direction:column}
.tx-item{display:flex;align-items:flex-start;gap:10px;padding:.75rem 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;margin-top:2px}
.tx-ico.income{background:rgba(22,163,74,.12)}
.tx-ico.transfer{background:rgba(37,99,235,.1)}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:.9rem;font-weight:600;color:var(--text)}
.tx-meta{font-size:.74rem;color:var(--text2);margin-top:1px}
.tx-actions{display:flex;gap:5px;margin-top:6px}
.abtn{background:var(--bg3);border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;color:var(--text2);cursor:pointer;font-weight:600}
.abtn.del{color:var(--expense)}
.empty{text-align:center;padding:1.5rem;color:var(--text3);font-size:.85rem}
</style>
</head>
<body>

<header class="topbar">
  <button class="backbtn" onclick="window.location.href='index.html'" aria-label="Voltar">←</button>
  <h1>🔔 Lembretes</h1>
</header>

<main class="content">
  <div class="card">
    <div class="card-title">
      <h2>Novo lembrete</h2>
      <span id="lembretesPermStatus"></span>
    </div>

    <form id="formLembrete" class="fgrid">
      <label class="full">
        Não quero esquecer de...
        <input type="text" id="lembreteTexto" placeholder="Ex: Pagar o boleto do cartão" required maxlength="140"/>
      </label>
      <label>
        Data
        <input type="date" id="lembreteData" required/>
      </label>
      <label>
        Hora
        <input type="time" id="lembreteHora" required/>
      </label>
      <label class="full">
        Repetir
        <select id="lembreteRepeticao">
          <option value="none">Não repetir</option>
          <option value="daily">Todo dia</option>
          <option value="weekly">Toda semana</option>
          <option value="monthly">Todo mês</option>
        </select>
      </label>
      <div class="full">
        <button type="submit" class="pbtn">Salvar lembrete</button>
      </div>
    </form>
  </div>

  <div class="card" id="debugCard">
    <div class="card-title">
      <h2>🔧 Diagnóstico</h2>
      <button class="abtn" id="btnDiagnostico" type="button">Verificar agendadas</button>
    </div>
    <div id="debugOutput" class="empty">Toque em "Verificar agendadas" pra ver o que o Android tem registrado.</div>
  </div>

  <div class="card">
    <div class="card-title">
      <h2>Seus lembretes</h2>
    </div>
    <div class="tx-list" id="listaLembretes">
      <div class="empty">Carregando...</div>
    </div>
  </div>
</main>

<!-- Tema salvo (mesmo padrão do index.html) -->
<script>
(function(){
  var saved = localStorage.getItem("financas-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
})();
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>

<!-- Plugin nativo de notificações locais (funciona dentro do APK, sem internet) -->
<script src="capacitor-local-notifications.js"></script>

<script>
(function () {
  'use strict';

  // Troque pela sua VAPID key: Console Firebase > Configurações do projeto
  // > Cloud Messaging > Certificados push da Web
  const VAPID_KEY = 'BL_pFTNBcJadV_VQ4lWfqX7NWmRYSOeNH22lIYVlC0oFDPtihDcpQB9cCt3IX0wLubb6RzFNUYp-2NCV_FJ1ObE';

  let messaging = null;
  let currentUser = null;

  function getDb() { return firebase.firestore(); }

  // Detecta se está rodando dentro do APK (Capacitor), e não num navegador comum
  function isCapacitorNative() {
    return !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
  }

  function mapRepeticaoParaEvery(repeticao) {
    if (repeticao === 'daily') return 'day';
    if (repeticao === 'weekly') return 'week';
    if (repeticao === 'monthly') return 'month';
    return null;
  }

  async function agendarNotificacaoLocal(id, texto, dataHora, repeticao) {
    const { LocalNotifications } = window.Capacitor.Plugins;
    const schedule = { at: dataHora };
    const every = mapRepeticaoParaEvery(repeticao);
    if (every) { schedule.repeats = true; schedule.every = every; }

    await LocalNotifications.schedule({
      notifications: [{
        id,
        title: '🔔 Lembrete',
        body: texto,
        schedule
      }]
    });
  }

  async function cancelarNotificacaoLocal(id) {
    if (!isCapacitorNative() || !id) return;
    try {
      await window.Capacitor.Plugins.LocalNotifications.cancel({ notifications: [{ id: parseInt(id, 10) }] });
    } catch (err) {
      console.warn('Não foi possível cancelar a notificação local:', err);
    }
  }

  async function ativarNotificacoes() {
    const statusEl = document.getElementById('lembretesPermStatus');
    try {
      // Dentro do APK: usa notificações nativas do Android, não a API do navegador
      if (isCapacitorNative()) {
        const { LocalNotifications } = window.Capacitor.Plugins;
        if (!LocalNotifications) {
          if (statusEl) statusEl.textContent = 'Plugin não instalado';
          return;
        }
        const atual = await LocalNotifications.checkPermissions();
        let permissao = atual.display;
        if (permissao !== 'granted') {
          const resultado = await LocalNotifications.requestPermissions();
          permissao = resultado.display;
        }
        if (permissao !== 'granted') {
          if (statusEl) statusEl.textContent = 'Permissão negada';
          return;
        }
        if (statusEl) statusEl.textContent = 'Ativado ✅';
        return;
      }

      // Fora do APK (navegador/PWA): mantém o Web Push via Firebase
      if (!('Notification' in window)) {
        if (statusEl) statusEl.textContent = 'Não suportado';
        return;
      }
      const permissao = await Notification.requestPermission();
      if (permissao !== 'granted') {
        if (statusEl) statusEl.textContent = 'Permissão negada';
        return;
      }

      messaging = firebase.messaging();
      const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });

      if (token && currentUser) {
        await getDb().collection('users').doc(currentUser.uid).set(
          { fcmToken: token, fcmTokenAtualizadoEm: firebase.firestore.FieldValue.serverTimestamp() },
          { merge: true }
        );
        if (statusEl) statusEl.textContent = 'Ativado ✅';
      }

      messaging.onMessage((payload) => {
        const titulo = payload.notification?.title || 'Lembrete';
        const corpo = payload.notification?.body || '';
        if (Notification.permission === 'granted') new Notification(titulo, { body: corpo, icon: '/icon-192.png' });
        carregarLembretes();
      });
    } catch (err) {
      console.error('Erro ao ativar notificações:', err);
      if (statusEl) statusEl.textContent = 'Erro ao ativar';
    }
  }

  async function salvarLembrete(e) {
    e.preventDefault();
    if (!currentUser) { alert('Você precisa estar logado.'); return; }

    const texto = document.getElementById('lembreteTexto').value.trim();
    const data = document.getElementById('lembreteData').value;
    const hora = document.getElementById('lembreteHora').value;
    const repeticao = document.getElementById('lembreteRepeticao').value;
    if (!texto || !data || !hora) return;

    const dataHora = new Date(`${data}T${hora}:00`);
    if (isNaN(dataHora.getTime()) || dataHora < new Date()) { alert('Escolha uma data/hora no futuro.'); return; }

    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      const nativo = isCapacitorNative();
      const notifId = nativo ? Math.floor(Date.now() % 2147483647) : null;

      await getDb().collection('lembretes').add({
        uid: currentUser.uid,
        texto,
        dataHora: firebase.firestore.Timestamp.fromDate(dataHora),
        repeticao,
        enviado: false,
        notifId,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

      if (nativo) {
        await agendarNotificacaoLocal(notifId, texto, dataHora, repeticao);
      }

      e.target.reset();
      carregarLembretes();
    } catch (err) {
      console.error('Erro ao salvar lembrete:', err);
      alert('Não foi possível salvar. Tente novamente.');
    } finally {
      btn.disabled = false;
    }
  }

  async function carregarLembretes() {
    const lista = document.getElementById('listaLembretes');
    if (!currentUser || !lista) return;
    try {
      const snap = await getDb().collection('lembretes')
        .where('uid', '==', currentUser.uid)
        .orderBy('dataHora', 'asc')
        .get();

      if (snap.empty) {
        lista.innerHTML = '<div class="empty">Nenhum lembrete cadastrado ainda.</div>';
        return;
      }

      lista.innerHTML = '';
      snap.forEach((doc) => {
        const l = doc.data();
        const dt = l.dataHora?.toDate ? l.dataHora.toDate() : new Date(l.dataHora);
        const item = document.createElement('div');
        item.className = 'tx-item';
        item.innerHTML = `
          <div class="tx-ico ${l.enviado ? 'transfer' : 'income'}">🔔</div>
          <div class="tx-body">
            <div class="tx-desc">${escapeHtml(l.texto)}</div>
            <div class="tx-meta">${dt.toLocaleDateString('pt-BR')} às ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})} ${l.repeticao && l.repeticao !== 'none' ? '· repete: ' + traduzirRepeticao(l.repeticao) : ''} ${l.enviado ? '· enviado' : ''}</div>
            <div class="tx-actions">
              <button class="abtn del" data-id="${doc.id}" data-notif-id="${l.notifId || ''}">Excluir</button>
            </div>
          </div>`;
        lista.appendChild(item);
      });

      lista.querySelectorAll('.abtn.del').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Excluir este lembrete?')) return;
          await cancelarNotificacaoLocal(btn.dataset.notifId);
          await getDb().collection('lembretes').doc(btn.dataset.id).delete();
          carregarLembretes();
        });
      });
    } catch (err) {
      console.error('Erro ao carregar lembretes:', err);
      lista.innerHTML = '<div class="empty">Erro ao carregar lembretes.</div>';
    }
  }

  function traduzirRepeticao(r) { return { daily: 'diário', weekly: 'semanal', monthly: 'mensal' }[r] || r; }
  function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  async function rodarDiagnostico() {
    const out = document.getElementById('debugOutput');
    if (!out) return;

    if (!isCapacitorNative()) {
      out.textContent = 'Diagnóstico só funciona dentro do APK (Capacitor), não no navegador.';
      return;
    }
    const { LocalNotifications } = window.Capacitor.Plugins;
    if (!LocalNotifications) {
      out.textContent = 'Plugin LocalNotifications não encontrado. Confira se o capacitor-local-notifications.js foi incluído e se você rodou "npx cap sync android".';
      return;
    }

    try {
      const perm = await LocalNotifications.checkPermissions();
      const pendentes = await LocalNotifications.getPending();

      let linhas = [];
      linhas.push('Permissão de notificação: ' + perm.display);
      linhas.push('Notificações agendadas no Android: ' + pendentes.notifications.length);

      pendentes.notifications.forEach((n) => {
        linhas.push('— #' + n.id + ' "' + n.title + '" em ' + new Date(n.schedule?.at || n.schedule?.repeats ? n.schedule.at : n.schedule).toLocaleString('pt-BR'));
      });

      out.innerHTML = linhas.map(l => '<div>' + escapeHtml(l) + '</div>').join('');
    } catch (err) {
      console.error('Erro no diagnóstico:', err);
      out.textContent = 'Erro ao consultar: ' + (err.message || err);
    }
  }

  document.getElementById('formLembrete').addEventListener('submit', salvarLembrete);
  document.getElementById('btnDiagnostico')?.addEventListener('click', rodarDiagnostico);

  // Usa o mesmo Firebase Auth já configurado no seu app
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      document.getElementById('listaLembretes').innerHTML = '<div class="empty">Faça login para ver seus lembretes.</div>';
      return;
    }
    currentUser = user;
    ativarNotificacoes();
    carregarLembretes();
  });
})();
</script>
</body>
</html>
