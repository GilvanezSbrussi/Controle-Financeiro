<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Extrato — Controle sua Fortuna</title>
  <style>
    :root{
      --primary:#0f766e;--income:#15803d;--expense:#b42318;--transfer:#1d4ed8;
      --bg:#f0f7f5;--bg2:#fff;--bg3:#e8f0ee;--text:#17211f;--text2:#61716d;--text3:#9ca3af;
      --border:#dce5e2;--shadow:0 2px 8px rgba(0,0,0,.06);--radius:14px;--rsm:10px;
    }
    [data-theme="dark"]{
      --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--text:#f3f4f6;--text2:#9ca3af;
      --text3:#6b7280;--border:#2d3148;--primary:#14b8a6;--income:#22c55e;
      --expense:#ef4444;--transfer:#60a5fa;--shadow:0 2px 16px rgba(0,0,0,.3);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .topbar{background:var(--primary);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50}
    .topbar a{color:#fff;text-decoration:none;font-size:1.4rem;line-height:1;flex-shrink:0}
    .topbar h1{font-size:1.1rem;font-weight:700;flex:1}
    .topbar-actions{display:flex;gap:6px;flex-wrap:wrap}
    .tbtn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
    .tbtn:hover{background:rgba(255,255,255,.3)}
    .tbtn:active{transform:scale(.95)}
    .tbtn-theme{background:rgba(255,255,255,.18);border:none;cursor:pointer;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .2s}
    .tbtn-theme:hover{background:rgba(255,255,255,.3)}
    .content{padding:1rem;max-width:600px;margin:0 auto;padding-bottom:60px}
    .filters{background:var(--bg2);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
    .filter-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
    .filter-row label{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--text2)}
    .filter-row input,.filter-row select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--bg3);color:var(--text);outline:none;width:100%}
    .filter-row input:focus,.filter-row select:focus{border-color:var(--primary)}
    .date-actions{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
    .clear-dates-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}
    .clear-dates-btn:hover{background:var(--border);color:var(--text)}
    .filter-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
    .chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);font-size:.8rem;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;user-select:none}
    .chip:active{transform:scale(.95)}
    .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .chip.income.active{background:var(--income);border-color:var(--income)}
    .chip.expense.active{background:var(--expense);border-color:var(--expense)}
    .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem}
    .summary-card{background:var(--bg2);border-radius:var(--rsm);padding:.85rem;text-align:center;box-shadow:var(--shadow)}
    .summary-card small{font-size:.72rem;color:var(--text2);display:block;margin-bottom:4px}
    .summary-card strong{font-size:.95rem;font-weight:700;display:block}
    .income-text{color:var(--income)}
    .expense-text{color:var(--expense)}
    .balance-text{color:var(--primary)}
    .section-label{font-size:.78rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:.65rem 0 .3rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);margin-bottom:.35rem;position:sticky;top:64px;background:var(--bg);z-index:5}
    .day-total{font-size:.72rem;font-weight:700}
    .transaction-item{background:var(--bg2);border-radius:var(--rsm);padding:.85rem 1rem;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
    .transaction-info{flex:1;display:flex;flex-direction:column;gap:4px}
    .transaction-category{font-size:.85rem;font-weight:600;color:var(--text)}
    .transaction-date{font-size:.72rem;color:var(--text2)}
    .transaction-amount{font-size:.9rem;font-weight:700;text-align:right}
    .amount-income{color:var(--income)}
    .amount-expense{color:var(--expense)}
    .amount-transfer{color:var(--transfer)}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
    .modal.show{display:flex}
    .modal-content{background:var(--bg2);border-radius:var(--radius);padding:1.5rem;max-width:90%;width:320px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:slideUp .3s ease-out}
    @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-title{font-size:1rem;font-weight:700;margin-bottom:1rem;color:var(--text)}
    .modal-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
    .modal-btn{padding:8px 16px;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;width:100%;margin-bottom:.4rem}
    .modal-btn-cancel{background:var(--bg3);color:var(--text)}
    .modal-btn-confirm{background:var(--primary);color:#fff}
    .modal-btn-share{background:#2563eb;color:#fff}
    .modal-btn-open{background:#7c3aed;color:#fff}
    .modal-btn:active{transform:scale(.95)}
    .loader{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;flex-direction:column}
    .loader.show{display:flex}
    .spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-text{color:#fff;margin-top:1rem;font-size:.9rem;text-align:center}
    .loader-progress{color:#fff;margin-top:.5rem;font-size:.8rem;opacity:.8}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:1rem 1.5rem;border-radius:8px;box-shadow:var(--shadow);z-index:3000;display:none;max-width:90%;word-break:break-word;animation:toastSlide .3s ease-out;text-align:center}
    .toast.show{display:block}
    .toast.error{background:var(--expense)}
    .toast.success{background:var(--income)}
    @keyframes toastSlide{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
    @media (max-width:480px){
      .topbar{padding:.8rem 1rem}
      .topbar h1{font-size:1rem}
      .topbar-actions{gap:4px}
      .tbtn{padding:7px 10px;font-size:.75rem}
      .summary{grid-template-columns:1fr}
      .content{padding:.75rem}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">←</a>
    <h1>Extrato</h1>
    <div class="topbar-actions">
      <button class="tbtn" id="exportPdfBtn" title="Exportar em PDF">📄 PDF</button>
      <button class="tbtn-theme" id="themeBtn" title="Alternar tema">🌙</button>
    </div>
  </div>

  <div class="content">
    <div class="filters">
      <div class="filter-chips">
        <div class="chip active" data-filter="all">Todos</div>
        <div class="chip income" data-filter="income">Entrada</div>
        <div class="chip expense" data-filter="expense">Saída</div>
        <div class="chip transfer" data-filter="transfer">Transferência</div>
      </div>
      <div class="filter-row">
        <label>Data inicial<input type="date" id="dateFrom"></label>
        <label>Data final<input type="date" id="dateTo"></label>
      </div>
      <div class="date-actions">
        <button class="clear-dates-btn" id="clearDatesBtn">🗓️ Mês atual</button>
        <button class="clear-dates-btn" id="clearAllDatesBtn">📅 Todas as datas</button>
      </div>
    </div>

    <div class="summary">
      <div class="summary-card"><small>Entradas</small><strong class="income-text" id="totalIncome">R$ 0,00</strong></div>
      <div class="summary-card"><small>Saídas</small><strong class="expense-text" id="totalExpense">R$ 0,00</strong></div>
      <div class="summary-card"><small>Saldo</small><strong class="balance-text" id="totalBalance">R$ 0,00</strong></div>
    </div>

    <div id="transactionsList"></div>
  </div>

  <!-- MODAL EXPORTAR -->
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h3 class="modal-title">Exportar Extrato</h3>
      <p style="font-size:.9rem;color:var(--text2);margin-bottom:1.5rem">Escolha como deseja exportar seu extrato:</p>
      <div class="modal-actions" style="flex-direction:column">
        <button class="modal-btn modal-btn-confirm" id="confirmBtn">📥 Baixar / Compartilhar PDF</button>
        <button class="modal-btn modal-btn-open" id="openBtn">👁️ Visualizar PDF</button>
        <button class="modal-btn modal-btn-cancel" id="cancelBtn">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="loader" id="loader">
    <div style="text-align:center">
      <div class="spinner"></div>
      <div class="loader-text">Gerando PDF...</div>
      <div class="loader-progress" id="loaderProgress">Aguarde</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    // ========== DETECÇÃO DE AMBIENTE ==========
    function isAndroid() { return /Android/i.test(navigator.userAgent); }
    function isWebView() {
      const ua = navigator.userAgent || '';
      return /(wv|WebView|Cordova|Capacitor)/i.test(ua) ||
             typeof window.cordova !== 'undefined' ||
             typeof window.Capacitor !== 'undefined';
    }
    function isAndroidApp() {
      return isAndroid() && (isWebView() || window.location.protocol === 'file:');
    }
    function supportsWebShare() { return typeof navigator.share === 'function'; }
    function supportsFileShare(file) {
      return supportsWebShare() && navigator.canShare && navigator.canShare({ files: [file] });
    }

    // ========== BASE DE DADOS ==========
    function getTransactionsFromDatabase() {
      try {
        const data = JSON.parse(localStorage.getItem("financas-v3") || "{}");
        return Array.isArray(data.transactions) ? data.transactions : [];
      } catch(e) { return []; }
    }
    function getAccountsFromDatabase() {
      try {
        const data = JSON.parse(localStorage.getItem("financas-v3") || "{}");
        return Array.isArray(data.accounts) ? data.accounts : [
          {id:"corrente",name:"Conta corrente"},{id:"investimentos",name:"Investimentos"}
        ];
      } catch(e) { return []; }
    }
    function getAccountNameById(id) {
      const acc = getAccountsFromDatabase().find(a => a.id === id);
      return acc ? acc.name : id;
    }

    // ========== DATAS ==========
    function getCurrentMonthDates() {
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const last  = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().split('T')[0];
      return { firstDay: first, lastDay: last };
    }
    function setCurrentMonthDates() {
      const { firstDay, lastDay } = getCurrentMonthDates();
      document.getElementById('dateFrom').value = firstDay;
      document.getElementById('dateTo').value   = lastDay;
    }

    let transactions = getTransactionsFromDatabase();
    let currentFilter = 'all';

    // ========== TEMA ==========
    const themeBtn = document.getElementById('themeBtn');
    const htmlEl   = document.documentElement;
    function initTheme() {
      const saved = localStorage.getItem('financas-theme') || 'light';
      htmlEl.setAttribute('data-theme', saved);
      themeBtn.textContent = saved === 'light' ? '🌙' : '☀️';
    }
    themeBtn.addEventListener('click', () => {
      const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      htmlEl.setAttribute('data-theme', next);
      localStorage.setItem('financas-theme', next);
      themeBtn.textContent = next === 'light' ? '🌙' : '☀️';
    });

    // ========== FORMATAÇÃO ==========
    function formatCurrency(v) {
      return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Math.abs(v));
    }
    function formatDate(s) {
      return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
        .format(new Date(s+'T00:00:00'));
    }
    function formatDateDisplay(s) {
      return new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'2-digit'})
        .format(new Date(s+'T00:00:00')).replace(/,/,'');
    }
    const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // ========== FILTROS ==========
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderTransactions();
      });
    });
    document.getElementById('dateFrom').addEventListener('change', renderTransactions);
    document.getElementById('dateTo').addEventListener('change', renderTransactions);
    document.getElementById('clearDatesBtn').addEventListener('click', () => {
      setCurrentMonthDates(); renderTransactions();
      const now = new Date();
      showToast(`Filtro: ${MONTHS[now.getMonth()]}/${now.getFullYear()}`, 'success');
    });
    document.getElementById('clearAllDatesBtn').addEventListener('click', () => {
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      renderTransactions();
      showToast('Exibindo todas as transações', 'success');
    });

    // ========== RENDERIZAÇÃO ==========
    function getFilteredTransactions() {
      let f = [...transactions];
      if (currentFilter !== 'all') f = f.filter(t => t.type === currentFilter);
      const from = document.getElementById('dateFrom').value;
      const to   = document.getElementById('dateTo').value;
      if (from) f = f.filter(t => t.date >= from);
      if (to)   f = f.filter(t => t.date <= to);
      return f.sort((a,b) => new Date(b.date) - new Date(a.date));
    }

    function renderTransactions() {
      const filtered = getFilteredTransactions();
      const container = document.getElementById('transactionsList');
      container.innerHTML = '';

      if (!filtered.length) {
        const from = document.getElementById('dateFrom').value;
        const to   = document.getElementById('dateTo').value;
        let msg = 'Nenhuma transação encontrada';
        if (from && to) msg += ` de ${formatDate(from)} a ${formatDate(to)}`;
        container.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text2)">${msg}</div>`;
        updateSummary([]);
        return;
      }

      const grouped = {};
      filtered.forEach(t => { if (!grouped[t.date]) grouped[t.date]=[]; grouped[t.date].push(t); });

      Object.keys(grouped).sort((a,b)=>new Date(b)-new Date(a)).forEach(date => {
        const items = grouped[date];
        const dayTotal = items.reduce((s,t) => {
          const amt = parseFloat(t.amount)||0;
          if (t.type==='income') return s+amt;
          if (t.type==='expense') return s-amt;
          return s+amt;
        }, 0);

        const section = document.createElement('div');
        section.innerHTML = `<div class="section-label"><span>${formatDateDisplay(date)}</span><span class="day-total">${formatCurrency(dayTotal)}</span></div>`;

        items.forEach(t => {
          const item = document.createElement('div');
          item.className = 'transaction-item';
          const amt = parseFloat(t.amount)||0;
          let sign='', cls='', display=Math.abs(amt);
          if (t.type==='income'){ sign='+'; cls='amount-income'; }
          else if (t.type==='expense'){ sign='-'; cls='amount-expense'; }
          else { cls='amount-transfer'; sign=amt>=0?'+':'-'; }

          let desc = t.description||'Sem descrição';
          if (t.type==='transfer') desc+=` (${getAccountNameById(t.fromAccount)} → ${getAccountNameById(t.toAccount)})`;
          const cat = (t.category && t.type!=='transfer') ? ` • ${t.category}` : '';

          item.innerHTML = `
            <div class="transaction-info">
              <span class="transaction-category">${desc}${cat}</span>
              <span class="transaction-date">${formatDate(t.date)}</span>
            </div>
            <span class="transaction-amount ${cls}">${sign}${formatCurrency(display)}</span>`;
          section.appendChild(item);
        });
        container.appendChild(section);
      });
      updateSummary(filtered);
    }

    function updateSummary(filtered) {
      const income  = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
      const expense = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(parseFloat(t.amount)||0),0);
      document.getElementById('totalIncome').textContent  = formatCurrency(income);
      document.getElementById('totalExpense').textContent = formatCurrency(expense);
      document.getElementById('totalBalance').textContent = formatCurrency(income - expense);
    }

    function refreshData() { transactions = getTransactionsFromDatabase(); renderTransactions(); }
    window.addEventListener('storage', e => { if(e.key==='financas-v3') refreshData(); });
    window.addEventListener('focus', refreshData);

    // ========== PDF ==========
    const loader         = document.getElementById('loader');
    const loaderProgress = document.getElementById('loaderProgress');
    const confirmModal   = document.getElementById('confirmModal');

    function updateProgress(t) { loaderProgress.textContent = t; }
    function showLoader(){ loader.classList.add('show'); }
    function hideLoader(){ loader.classList.remove('show'); }

    document.getElementById('exportPdfBtn').addEventListener('click', () => confirmModal.classList.add('show'));
    document.getElementById('cancelBtn').addEventListener('click', () => confirmModal.classList.remove('show'));
    confirmModal.addEventListener('click', e => { if(e.target===confirmModal) confirmModal.classList.remove('show'); });

    // ── BAIXAR / COMPARTILHAR ──
    document.getElementById('confirmBtn').addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      showLoader();
      updateProgress('Preparando documento...');
      try {
        const { docEl, filename } = buildPDFDocument();
        updateProgress('Gerando PDF...');
        const blob = await generatePDFBlob(docEl);
        updateProgress('Salvando...');
        await saveOrSharePDF(blob, filename);
      } catch(err) {
        console.error(err);
        showToast('Erro ao gerar PDF: ' + (err.message||''), 'error');
      } finally { hideLoader(); }
    });

    // ── VISUALIZAR ──
    document.getElementById('openBtn').addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      showLoader();
      updateProgress('Gerando PDF...');
      try {
        const { docEl, filename } = buildPDFDocument();
        const blob = await generatePDFBlob(docEl);
        updateProgress('Abrindo...');
        await viewPDF(blob, filename);
      } catch(err) {
        console.error(err);
        showToast('Erro ao gerar PDF: ' + (err.message||''), 'error');
      } finally { hideLoader(); }
    });

    // ── SALVAR OU COMPARTILHAR (Baixar) ──
    async function saveOrSharePDF(blob, filename) {
      // 1) Tenta Web Share com arquivo (Android APK + Chrome)
      if (supportsWebShare()) {
        try {
          const file = new File([blob], filename, { type: 'application/pdf' });
          if (supportsFileShare(file)) {
            await navigator.share({ files: [file], title: 'Extrato', text: 'Controle sua Fortuna' });
            showToast('PDF compartilhado!', 'success');
            return;
          }
        } catch(e) {
          if (e.name === 'AbortError') return; // usuário cancelou
        }
      }
      // 2) Fallback: download direto
      downloadBlob(blob, filename);
      showToast('PDF baixado! Verifique a pasta Downloads.', 'success');
    }

    // ── VISUALIZAR PDF ──
    // No APK/WebView o iframe não funciona — usamos Web Share ou download direto.
    // No navegador desktop abrimos em nova aba.
    async function viewPDF(blob, filename) {
      // APK / Android WebView
      if (isAndroidApp()) {
        try {
          const file = new File([blob], filename, { type: 'application/pdf' });
          if (supportsFileShare(file)) {
            await navigator.share({ files: [file], title: 'Extrato', text: 'Abra com seu leitor de PDF' });
            showToast('Escolha um app para abrir o PDF.', 'success');
            return;
          }
        } catch(e) {
          if (e.name === 'AbortError') return;
        }
        // Se Web Share não funcionar no APK, faz download
        downloadBlob(blob, filename);
        showToast('PDF salvo! Abra-o na pasta Downloads.', 'success');
        return;
      }

      // Navegador desktop/mobile — tenta abrir em nova aba
      const url = URL.createObjectURL(blob);
      const win = window.open(url, '_blank');
      if (win) {
        showToast('PDF aberto em nova aba!', 'success');
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      } else {
        // Popup bloqueado — faz download como fallback
        downloadBlob(blob, filename);
        showToast('Popup bloqueado. PDF baixado automaticamente.', 'success');
        URL.revokeObjectURL(url);
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    }

    // ========== CONSTRUIR DOCUMENTO PDF ==========
    function buildPDFDocument() {
      const filtered = getFilteredTransactions();
      const from = document.getElementById('dateFrom').value;
      const to   = document.getElementById('dateTo').value;
      let periodText = 'Todas as transações';
      if (from && to) periodText = `Período: ${formatDate(from)} a ${formatDate(to)}`;
      else if (from)  periodText = `A partir de: ${formatDate(from)}`;
      else if (to)    periodText = `Até: ${formatDate(to)}`;

      const docEl = document.createElement('div');
      docEl.style.cssText = 'background:#fff;color:#000;padding:20px;font-family:Arial,sans-serif;width:210mm;margin:0 auto';

      docEl.innerHTML = `
        <div style="text-align:center;margin-bottom:30px;border-bottom:2px solid #0f766e;padding-bottom:15px">
          <h1 style="margin:0;color:#0f766e;font-size:24px">Extrato de Transações</h1>
          <p style="margin:5px 0 0;color:#666;font-size:12px">Controle sua Fortuna</p>
          <p style="margin:10px 0 0;color:#888;font-size:11px">${periodText}</p>
        </div>
        <p style="text-align:right;color:#999;font-size:11px;margin-bottom:20px">Gerado em: ${new Date().toLocaleString('pt-BR')}</p>`;

      const income  = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+(parseFloat(t.amount)||0),0);
      const expense = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(parseFloat(t.amount)||0),0);
      const balance = income - expense;

      const summaryDiv = document.createElement('div');
      summaryDiv.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:30px';
      summaryDiv.innerHTML = `
        <div style="border:1px solid #ddd;padding:15px;border-radius:8px;text-align:center">
          <p style="margin:0;color:#666;font-size:12px">Entradas</p>
          <p style="margin:5px 0 0;color:#15803d;font-size:16px;font-weight:bold">${formatCurrency(income)}</p>
        </div>
        <div style="border:1px solid #ddd;padding:15px;border-radius:8px;text-align:center">
          <p style="margin:0;color:#666;font-size:12px">Saídas</p>
          <p style="margin:5px 0 0;color:#b42318;font-size:16px;font-weight:bold">${formatCurrency(expense)}</p>
        </div>
        <div style="border:1px solid #ddd;padding:15px;border-radius:8px;text-align:center">
          <p style="margin:0;color:#666;font-size:12px">Saldo</p>
          <p style="margin:5px 0 0;color:#0f766e;font-size:16px;font-weight:bold">${formatCurrency(balance)}</p>
        </div>`;
      docEl.appendChild(summaryDiv);

      const table = document.createElement('table');
      table.style.cssText = 'width:100%;border-collapse:collapse;margin-top:20px;font-size:11px';
      table.innerHTML = `<thead><tr style="background:#f0f7f5;border-bottom:2px solid #0f766e">
        <th style="padding:10px;text-align:left">Data</th>
        <th style="padding:10px;text-align:left">Descrição</th>
        <th style="padding:10px;text-align:left">Categoria</th>
        <th style="padding:10px;text-align:right">Valor</th>
      </tr></thead>`;

      const tbody = document.createElement('tbody');
      filtered.forEach((t, i) => {
        const tr = document.createElement('tr');
        tr.style.cssText = `border-bottom:1px solid #eee;background:${i%2===0?'#fff':'#f9f9f9'}`;
        const amt = parseFloat(t.amount)||0;
        const display = Math.abs(amt);
        let color='#000', sign='';
        if (t.type==='income'){color='#15803d';sign='+';}
        else if (t.type==='expense'){color='#b42318';sign='-';}
        else {color='#1d4ed8';sign=amt>=0?'+':'-';}
        const cat = t.category||(t.type==='transfer'?'Transferência':'-');
        tr.innerHTML = `
          <td style="padding:10px">${formatDate(t.date)}</td>
          <td style="padding:10px">${t.description||'Sem descrição'}</td>
          <td style="padding:10px">${cat}</td>
          <td style="padding:10px;text-align:right;color:${color};font-weight:bold">${sign}${formatCurrency(display)}</td>`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      docEl.appendChild(table);

      const footer = document.createElement('div');
      footer.style.cssText = 'margin-top:40px;padding-top:20px;border-top:1px solid #ddd;text-align:center;color:#999;font-size:10px';
      footer.textContent = '© 2024 Controle sua Fortuna. Documento confidencial.';
      docEl.appendChild(footer);

      return { docEl, filename: `Extrato_${new Date().toISOString().split('T')[0]}.pdf` };
    }

    function generatePDFBlob(docEl) {
      return html2pdf().set({
        margin: [10,10,10,10],
        image: { type:'jpeg', quality:0.98 },
        html2canvas: { scale:2, useCORS:true, allowTaint:true, logging:false, backgroundColor:'#ffffff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
      }).from(docEl).outputPdf('blob');
    }

    function showToast(message, type='info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ========== INIT ==========
    function init() {
      initTheme();
      setCurrentMonthDates();
      renderTransactions();
      const now = new Date();
      setTimeout(() => showToast(`Exibindo ${MONTHS[now.getMonth()]}/${now.getFullYear()} • Use os filtros para alterar`, 'info'), 1000);
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', init)
      : init();
  </script>
</body>
</html>
